[package]
name = "mantle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[example]]
name = "codex_qualification"
test = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
mantle-worker = { path = "../mantle-worker" }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-cloudwatch = "1"
aws-sdk-ec2 = "1"
aws-sdk-iam = "1"
b10x-substrate-sdk = { git = "https://github.com/beyond10x/substrate", rev = "65304edf6ebdf4a95f9c2c6138b0c20ea47d157e" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = "0.29"
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
rustix = { version = "1", features = ["fs", "process"] }
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.9"
tempfile = "3"
ulid = "1"

[lints]
workspace = true

[dev-dependencies]
mantle-release = { path = "../mantle-release" }
mantle-artifact = { path = "../mantle-artifact" }
mantle-egress = { path = "../mantle-egress" }
mantle-conformance = { path = "../mantle-conformance" }
tokio = { workspace = true, features = ["test-util"] }
