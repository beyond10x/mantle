[workspace]
resolver = "3"
members = ["crates/mantle", "crates/mantle-egress", "crates/mantle-launch", "crates/mantle-docs", "crates/mantle-conformance", "crates/mantle-worker"]
exclude = ["generated/worker-model"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
strip = true
