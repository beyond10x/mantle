name: Repository checks

on:
  push:
    branches: [main, 'spec/**', 'queue/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  check:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.97'
          components: rustfmt,clippy
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.10'
          cache: false
      - name: Install pinned verification tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/mantle-tools" "$HOME/.local/bin"
          cd "$RUNNER_TEMP/mantle-tools"
          curl --fail --location --retry 3 -o ess.tar.gz https://github.com/beyond10x/ess/releases/download/0.50.0/ess-0.50.0-x86_64-unknown-linux-gnu.tar.gz
          echo 'f2fed60e432ad86c51b8fc963a1beb9b8a5773d6e26c0c649c5cac3960b37c29  ess.tar.gz' | sha256sum --check
          tar -xzf ess.tar.gz
          curl --fail --location --retry 3 -o aep.tar.gz https://github.com/beyond10x/aep/releases/download/0.68.0/aep-0.68.0-x86_64-unknown-linux-gnu.tar.gz
          echo '02bf6a2c4bc9a3ffd717edfb365f665491005004f159774a8847d3cbd18c5e91  aep.tar.gz' | sha256sum --check
          tar -xzf aep.tar.gz
          install -m 755 ess-0.50.0-x86_64-unknown-linux-gnu/ess aep-0.68.0-x86_64-unknown-linux-gnu/aep "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: mantle-checks
          cache-directories: ~/.cache/b10x-target/mantle
      - name: Check source, ESS conformance, plan and documentation
        run: task check
      - name: Retain complete conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mantle-native-conformance
          path: |
            .engineering/drafts/mantle*-suite.json
            .engineering/drafts/mantle*-report.json
            .engineering/drafts/mantle*-run.json
            .engineering/drafts/mantle-results.json
            .engineering/drafts/mantle-synthesis.txt
          retention-days: 30
          if-no-files-found: warn
