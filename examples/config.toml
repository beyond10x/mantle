# Copy to ~/.config/mantle/config.toml and replace every placeholder.

# "aws" or "kubevirt". Both boot the same Ubuntu build and the same cloud-init.
provider = "kubevirt"
# The Ubuntu 24.04 build serial every provider boots (cloud-images.ubuntu.com/releases/noble/).
ubuntu_serial = "20260926"

[aws]
profile = "your-aws-profile"
region = "eu-central-1"
vpc = "vpc-00000000"
subnet = "subnet-00000000"
instance_type = "m7i.4xlarge"
root_volume_gib = 50
data_volume_gib = 200

[kubevirt]
# `task k3d-up` creates this context.
context = "k3d-mantle"
namespace = "mantle"
cpu = 8
memory_gib = 20
root_disk_gib = 20
data_disk_gib = 40

[claude]
# A command printing the token from `claude setup-token`; keep it in a keyring, not a file.
# token_file = "~/.config/mantle/claude-token" works where there is no keyring.
token_command = ["secret-tool", "lookup", "service", "mantle", "account", "claude-code"]
# Optional isolation: MANTLE_CONFIG selects this file and MANTLE_STATE_DIR selects
# a separate private directory for SQLite, SSH keys and known hosts. Both must be absolute.
# Development/unreleased (not 0.1.4): register this file with
# mantle profile add personal --config /absolute/config.toml --state-dir /absolute/private-state
# Then use mantle --profile personal list, or MANTLE_PROFILE=personal mantle list.
# Unset MANTLE_CONFIG and MANTLE_STATE_DIR before selecting a named profile.
# State paths support spaces/Unicode, but refuse quotes, backslashes, % and ${...}.
# Omit the entire [claude] table to provision common worker readiness without a Claude token.
# READY means common confinement/toolchain readiness; agent authentication is separate.
