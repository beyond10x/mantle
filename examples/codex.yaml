# Uses the existing Substrate terminal capture behavior, as Claude does.
# Complete ChatGPT device login in the Codex terminal when prompted.
apiVersion: mantle.beyond10x.dev/v1alpha1
kind: Session
metadata:
  name: codex-example
workspace:
  repositories:
    - name: substrate
      repository: https://github.com/beyond10x/substrate.git
      ref: main
      mount: substrate
agent:
  kind: codex
  auth: chatgpt-device
  cwd: /workspace/substrate
