domain: mantle.session
summary: Local records and decisions over explicit worker observations; a recorded Running state never asserts a live process.

types:
  # Proposed Codex parity vocabulary, not fields persisted by the current contract.
  # story:codex-interactive-start adds resolved agent/authentication fields together
  # with the SQLite migration, commands, views and implementation conformance cases.
  # Legacy records will resolve to ClaudeCode/ClaudeOauth at that migration boundary.
  - name: mantle.session.AgentKind
    kind: enum
    variants: [ClaudeCode, Codex]
  - name: mantle.session.AuthenticationMethod
    kind: enum
    variants: [ClaudeOauth, ChatgptDevice]
  # Proposed observed installation values for story:agent-ready-worker. These are
  # not persisted WorkerRecord fields or proof that an agent is authenticated.
  - name: mantle.session.AgentInstallationFacts
    kind: struct
    fields:
      - {name: version, type: String}
      - {name: architecture, type: String}
      - {name: compressed_sha256, type: String}
      - {name: binary_sha256, type: String}
  - name: mantle.session.AgentInstallationOutcome
    kind: enum
    variants: [AlreadyCurrent, Installed, Refused]
  - name: mantle.session.SourceKey
    kind: struct
    fields:
      - {name: session_id, type: String}
      - {name: mount, type: String}
  # crates/mantle/src/adapters/state.rs:44,60: composite PRIMARY KEY(session_id,mount).
  # PutSource/ReadSources execute composite-key inserts and reads; authored scenarios hold
  # isolation, duplicate refusal and retention without inventing an identifier or cascade.
  - name: mantle.session.SourceResolution
    kind: struct
    fields:
      - {name: session_id, type: String}
      - {name: name, type: String}
      - {name: repository, type: String}
      - {name: declared_ref, type: String}
      - {name: commit, type: String}
      - {name: mount, type: String}

entities:
  # crates/mantle/src/adapters/state.rs:30,60; domain/session.rs:10.
  - name: mantle.session.Session
    identity: {name: session_id, type: String, naming: {wire: id}}
    fields:
      - {name: name, type: String}
      - {name: worker, type: String}
      - {name: manifest_digest, type: String}
      - {name: workspace, type: 'Optional<String>'}
      - {name: agent_exec, type: 'Optional<String>'}
      - {name: requested_json, type: String}
      - {name: created_at, type: String}
      - {name: failure, type: 'Optional<String>'}
    relations:
      # Worker records survive session stop; no foreign-key or existence check is enforced.
      - {name: worker_record, kind: references, target: mantle.session.Worker, cardinality: one, via: worker}
    # Wire states are SCREAMING_SNAKE_CASE (SessionState::Display), not the ESS spelling.
    lifecycle:
      initial: Materializing
      states: [Materializing, Starting, Running, Stopping, Stopped, FailedMaterialization, FailedAgentStart]
      terminal: [Stopped]
      transitions:
        - {name: materialized, from: [Materializing], to: Starting}
        - {name: materialization_failed, from: [Materializing], to: FailedMaterialization}
        - {name: started, from: [Starting], to: Running}
        - {name: start_failed, from: [Starting], to: FailedAgentStart}
        - {name: stopping, from: [Materializing, Starting, Running, FailedMaterialization, FailedAgentStart], to: Stopping}
        - {name: stopped, from: [Stopping], to: Stopped}

  # crates/mantle/src/adapters/state.rs:22,106: an upserted record, not provider liveness.
  - name: mantle.session.Worker
    identity: {name: name, type: String}
    fields:
      - {name: instance, type: String}
      - {name: region, type: String}
      - {name: data_volume, type: 'Optional<String>'}
    # Structural state: WorkerRecord has no status column. worker down retains this record.
    lifecycle: {initial: Recorded, states: [Recorded], terminal: [Recorded]}

errors:
  - name: mantle.session.WorkerNotReady
    fields: []
  - name: mantle.session.InstallationRefused
    fields: []
  - name: mantle.session.InvalidTransition
    fields: []
  - name: mantle.session.RecordVanished
    fields: []
  - name: mantle.session.RecordConflict
    fields: []

# These are internal store operations invoked by app/session.rs, not new public CLI verbs.
# Events denote local writes only; Mantle has no event bus and publishes none of them.
commands:
  # Function boundaries over composite-key rows. PutSource returns SQLite's affected-row
  # count; Sources observes persisted rows. There is no synthetic source entity identifier.
  - name: mantle.session.PutSource
    input:
      - {name: key, type: mantle.session.SourceKey}
      - {name: name, type: String}
      - {name: repository, type: String}
      - {name: declared_ref, type: String}
      - {name: commit, type: String}
    response:
      - {name: affected, type: Integer}
      - {name: diagnostic, type: 'Optional<String>'}
    outcomes: [{name: returned, returns: true}]
  - name: mantle.session.ReadSources
    input: [{name: session_id, type: String}]
    response: [{name: rows, type: 'List<mantle.session.SourceResolution>'}]
    outcomes: [{name: returned, returns: true}]
  - name: mantle.session.AssessSharedBinaryUpgrade
    input:
      - {name: shared_service_active, type: Boolean}
      - {name: installed, type: Boolean}
      - {name: artifact_changed, type: Boolean}
    outcomes:
      - name: deferred
        when: {all: [shared_service_active == true, installed == true, artifact_changed == true]}
        accepts: nothing
      - name: applicable
        accepts: nothing
  # Pure decisions over observations, never WorkerRecord-derived liveness.
  - name: mantle.session.AssessWorkerReadiness
    input:
      - {name: common_ready, type: Boolean}
      - {name: claude_selected, type: Boolean}
      - {name: executable_present, type: Boolean}
      - {name: claude_slot_present, type: Boolean}
    outcomes:
      - name: ready
        when:
          all:
            - common_ready == true
            - any:
                - claude_selected == false
                - all: [executable_present == true, claude_slot_present == true]
        accepts: nothing
      - name: missing
        error: mantle.session.WorkerNotReady
  - name: mantle.session.AssessAgentInstallation
    input:
      - {name: architecture, type: String}
      - {name: current_verified, type: Boolean}
      - {name: archive_verified, type: Boolean}
      - {name: binary_verified, type: Boolean}
      - {name: version_verified, type: Boolean}
    outcomes:
      - name: already-current
        when: {all: [architecture == x86_64, current_verified == true]}
        accepts: nothing
      - name: installed
        when: {all: [architecture == x86_64, current_verified == false, archive_verified == true, binary_verified == true, version_verified == true]}
        accepts: nothing
      - name: refused
        error: mantle.session.InstallationRefused
  - name: mantle.session.InsertSession
    input:
      - {name: session_id, type: String}
      - {name: name, type: String, example: conformance-session}
      - {name: worker, type: String}
      - {name: manifest_digest, type: String}
      - {name: requested_json, type: String}
      - {name: created_at, type: String}
    outcomes:
      - name: recorded
        creates: mantle.session.Session
        instance: session_id
        sets:
          name: input.name
          worker: input.worker
          manifest_digest: input.manifest_digest
          requested_json: input.requested_json
          created_at: input.created_at
          workspace: {cleared: true}
          agent_exec: {cleared: true}
          failure: {cleared: true}
        emits: [mantle.session.SessionRecorded]
        payload:
          mantle.session.SessionRecorded: {session_id: input.session_id}
      - name: conflict
        external: SQLite rejects an existing id or an existing name whose state is not Stopped.
        error: mantle.session.RecordConflict
    # Authored live-name scenarios exercise the partial index in all seven states,
    # including reuse after Stopped and refusal while each other record remains live.
    # Input id is minted by app/session.rs:85; Store receives it, so it is not generated here.
  - name: mantle.session.Materialized
    input:
      - {name: session_id, type: String}
    outcomes:
      - name: moved
        moves: mantle.session.Session.materialized
        instance: session_id
        emits: [mantle.session.SessionChanged]
        payload:
          mantle.session.SessionChanged: {session_id: input.session_id}
      - name: wrong-state
        wrong_state: true
        error: mantle.session.InvalidTransition
      - name: missing
        unknown_instance: true
        error: mantle.session.RecordVanished
  - name: mantle.session.MaterializationFailed
    input:
      - {name: session_id, type: String}
      - {name: failure, type: String}
    outcomes:
      - name: moved
        moves: mantle.session.Session.materialization_failed
        instance: session_id
        sets: {failure: input.failure}
        emits: [mantle.session.SessionChanged]
        payload:
          mantle.session.SessionChanged: {session_id: input.session_id}
      - name: wrong-state
        wrong_state: true
        error: mantle.session.InvalidTransition
      - name: missing
        unknown_instance: true
        error: mantle.session.RecordVanished
  - name: mantle.session.AgentStarted
    input:
      - {name: session_id, type: String}
    outcomes:
      - name: moved
        moves: mantle.session.Session.started
        instance: session_id
        emits: [mantle.session.SessionChanged]
        payload:
          mantle.session.SessionChanged: {session_id: input.session_id}
      - name: wrong-state
        wrong_state: true
        error: mantle.session.InvalidTransition
      - name: missing
        unknown_instance: true
        error: mantle.session.RecordVanished
  - name: mantle.session.AgentStartFailed
    input:
      - {name: session_id, type: String}
      - {name: failure, type: String}
    outcomes:
      - name: moved
        moves: mantle.session.Session.start_failed
        instance: session_id
        sets: {failure: input.failure}
        emits: [mantle.session.SessionChanged]
        payload:
          mantle.session.SessionChanged: {session_id: input.session_id}
      - name: wrong-state
        wrong_state: true
        error: mantle.session.InvalidTransition
      - name: missing
        unknown_instance: true
        error: mantle.session.RecordVanished
  - name: mantle.session.BeginStop
    input:
      - {name: session_id, type: String}
    outcomes:
      - name: moved
        moves: mantle.session.Session.stopping
        instance: session_id
        emits: [mantle.session.SessionChanged]
        payload:
          mantle.session.SessionChanged: {session_id: input.session_id}
      - name: wrong-state
        wrong_state: true
        error: mantle.session.InvalidTransition
      - name: missing
        unknown_instance: true
        error: mantle.session.RecordVanished
  - name: mantle.session.FinishStop
    input:
      - {name: session_id, type: String}
    outcomes:
      - name: moved
        moves: mantle.session.Session.stopped
        instance: session_id
        emits: [mantle.session.SessionChanged]
        payload:
          mantle.session.SessionChanged: {session_id: input.session_id}
      - name: wrong-state
        wrong_state: true
        error: mantle.session.InvalidTransition
      - name: missing
        unknown_instance: true
        error: mantle.session.RecordVanished

  - name: mantle.session.SetWorkspace
    input:
      - {name: session_id, type: String}
      - {name: workspace, type: String}
    outcomes:
      - name: recorded
        updates: mantle.session.Session
        instance: session_id
        sets: {workspace: input.workspace}
        emits: [mantle.session.SessionChanged]
        payload:
          mantle.session.SessionChanged: {session_id: input.session_id}
      # SQL UPDATE of an unknown id returns success with zero affected rows (state.rs:177).
      - name: missing
        unknown_instance: true
        refuses: false
  - name: mantle.session.SetAgentExec
    input:
      - {name: session_id, type: String}
      - {name: agent_exec, type: String}
    outcomes:
      - name: recorded
        updates: mantle.session.Session
        instance: session_id
        sets: {agent_exec: input.agent_exec}
        emits: [mantle.session.SessionChanged]
        payload:
          mantle.session.SessionChanged: {session_id: input.session_id}
      - name: missing
        unknown_instance: true
        refuses: false

# Orchestration is specified separately in mantle.orchestration. Its native scenarios execute
# app/session.rs and app/worker.rs over provider IO ports and read actual SQLite state.
# Stop deliberately skips BeginStop when already Stopping, then resumes external cleanup.
events:
  - name: mantle.session.SessionRecorded
    fields: [{name: session_id, type: String}]
  - name: mantle.session.SessionChanged
    fields: [{name: session_id, type: String}]

views:
  # state.rs:219,243: session_by_id is internal; live_sessions is the CLI read model.
  - name: mantle.session.SessionRecords
    source: mantle.session.Session
    consistency: read_your_writes
    fields:
      - {name: session_id, type: 'String'}
      - {name: state, type: 'mantle.session.Session.State'}
      - {name: name, type: 'String'}
      - {name: worker, type: 'String'}
      - {name: manifest_digest, type: 'String'}
      - {name: workspace, type: 'Optional<String>'}
      - {name: agent_exec, type: 'Optional<String>'}
      - {name: requested_json, type: 'String'}
      - {name: created_at, type: 'String'}
      - {name: failure, type: 'Optional<String>'}
  # state.rs:219,243: session_by_id is internal; live_sessions is the CLI read model.
  - name: mantle.session.LiveSessions
    source: mantle.session.Session
    consistency: read_your_writes
    filter: state != Stopped
    fields:
      - {name: session_id, type: 'String'}
      - {name: state, type: 'mantle.session.Session.State'}
      - {name: name, type: 'String'}
      - {name: worker, type: 'String'}
      - {name: manifest_digest, type: 'String'}
      - {name: workspace, type: 'Optional<String>'}
      - {name: agent_exec, type: 'Optional<String>'}
      - {name: requested_json, type: 'String'}
      - {name: created_at, type: 'String'}
      - {name: failure, type: 'Optional<String>'}
