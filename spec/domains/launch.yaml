domain: mantle.launch
summary: In-sandbox process and attachment arguments; no credential value is modeled.
# Sources: crates/mantle-launch/src/cli.rs:29-90, ctl.rs, serve.rs:33-40.
types:
  - name: mantle.launch.ServeArgs
    kind: struct
    fields:
      - {name: dir, type: Bytes}
      - {name: secret_fd, type: 'Optional<Integer>'}
      - {name: secret_env, type: 'Optional<String>'}
      - {name: proxy, type: 'Optional<String>'}
      - {name: cwd, type: Bytes}
      - {name: mkdirs, type: 'List<Bytes>'}
      - {name: scrollback_bytes, type: Integer}
      # Proposed launcher-only policy: keep bounded live replay, never write last-output.
      # CLI omission remains false; this does not control Substrate or Codex recording.
      - {name: volatile_replay, type: Boolean}
      - {name: command, type: 'List<Bytes>'}
    # The CLI's bound is the ValidateScrollback command, exercised through clap itself.
  - name: mantle.launch.AttachArgs
    kind: struct
    fields:
      - {name: dir, type: Bytes}
      - {name: no_tty, type: Boolean}
  - name: mantle.launch.Window
    kind: struct
    fields:
      - {name: cols, type: Integer}
      - {name: rows, type: Integer}
# Bytes preserve non-UTF8 OS arguments. Native scenarios run real PTYs, FIFOs and processes
# for locking, credential descriptor closure, detach/replay, resize, signals and slow readers.
# These are OS observations; Attached/Detached are not invented database states.
errors:
  - name: mantle.launch.InvalidScrollback
    fields: []
commands:
  - name: mantle.launch.ParseArgs
    input: [{name: argv, type: 'List<Bytes>'}]
    response:
      - {name: accepted, type: Boolean}
      - {name: diagnostic, type: 'Optional<String>'}
      - {name: serve, type: 'Optional<mantle.launch.ServeArgs>'}
      - {name: attach, type: 'Optional<mantle.launch.AttachArgs>'}
    outcomes: [{name: returned, returns: true}]
  - name: mantle.launch.ReadSecret
    # Only synthetic credential bytes enter this conformance boundary. Observe a digest, not a secret.
    input: [{name: bytes, type: Bytes}]
    response:
      - {name: accepted, type: Boolean}
      - {name: digest, type: 'Optional<String>'}
      - {name: diagnostic, type: 'Optional<String>'}
    outcomes: [{name: returned, returns: true}]
  - name: mantle.launch.ParseWindow
    input: [{name: chunks, type: 'List<Bytes>'}]
    response: [{name: windows, type: 'List<mantle.launch.Window>'}]
    outcomes: [{name: returned, returns: true}]
  - name: mantle.launch.ReplayRing
    input:
      - {name: capacity, type: Integer, example: 8}
      - {name: chunks, type: 'List<Bytes>'}
    response: [{name: bytes, type: Bytes}]
    outcomes: [{name: returned, returns: true}]
  - name: mantle.launch.Emit
    # A real launcher + Rust fixture process observes OS argv bytes and exit propagation.
    input:
      - {name: argv, type: 'List<Bytes>'}
      - {name: exit, type: Integer}
    response:
      - {name: exit, type: 'Optional<Integer>'}
      - {name: output, type: Bytes}
      - {name: credential_in_diagnostic, type: Boolean}
    outcomes: [{name: returned, returns: true}]
  - name: mantle.launch.Lifecycle
    # Real PTY, FIFOs and processes: one attachment, detach/replay, resize, credential FD closure.
    response:
      - {name: relayed, type: Boolean}
      - {name: replayed, type: Boolean}
      - {name: survived_detach, type: Boolean}
      - {name: duplicate_attach_refused, type: Boolean}
      - {name: duplicate_server_refused, type: Boolean}
      - {name: fifo_permissions, type: 'List<Integer>'}
      - {name: resized, type: Boolean}
      - {name: server_exit, type: 'Optional<Integer>'}
      - {name: cleaned, type: Boolean}
      - {name: secret_descriptor_closed, type: Boolean}
      - {name: credential_fingerprint, type: 'Optional<List<Integer>>'}
      - {name: credential_in_diagnostic, type: Boolean}
    outcomes: [{name: returned, returns: true}]
  - name: mantle.launch.ValidateScrollback
    # Parse the --scrollback-bytes value with otherwise-valid serve arguments.
    input: [{name: bytes, type: Integer, example: 262144}]
    response: [{name: valid, type: Boolean}]
    outcomes:
      - name: accepted
        when: {all: [bytes >= 1024, bytes <= 67108864]}
        returns: true
      - name: refused
        error: mantle.launch.InvalidScrollback

  - name: mantle.launch.Signals
    response:
      - {name: exit, type: 'Optional<Integer>'}
      - {name: signal_forwarded, type: 'Boolean'}
      - {name: descendant_exited, type: 'Boolean'}
    outcomes: [{name: returned, returns: true}]

  - name: mantle.launch.SlowReader
    response:
      - {name: exit, type: 'Optional<Integer>'}
      - {name: retained_bytes, type: 'Integer'}
      - {name: tail_is_output, type: 'Boolean'}
    outcomes: [{name: returned, returns: true}]

  - name: mantle.launch.FileSafety
    response:
      - {name: directory_link_refused, type: 'Boolean'}
      - {name: lock_link_refused, type: 'Boolean'}
      - {name: fifo_link_refused, type: 'Boolean'}
      - {name: regular_fifo_refused, type: 'Boolean'}
      - {name: remove_regular_refused, type: 'Boolean'}
      - {name: target_mode, type: 'Integer'}
      - {name: file_bytes, type: 'Bytes'}
      - {name: directory_mode, type: 'Integer'}
      - {name: duplicate_refused, type: 'Boolean'}
      - {name: reacquired, type: 'Boolean'}
    outcomes: [{name: returned, returns: true}]

  - name: mantle.launch.VolatileReplayLifecycle
    # Real launcher, agent and FIFO clients; collectors are bounded in bytes and time.
    response:
      - {name: relayed, type: Boolean}
      - {name: replayed, type: Boolean}
      - {name: survived_detach, type: Boolean}
      - {name: resized, type: Boolean}
      - {name: last_output_during, type: Boolean}
      - {name: last_output_after, type: Boolean}
      - {name: exit, type: Integer}
      - {name: canary_in_diagnostics, type: Boolean}
    outcomes: [{name: returned, returns: true}]

  - name: mantle.launch.VolatileReplayExitPaths
    # Ordered cases: clean, nonzero, SIGTERM, missing program, server SIGKILL.
    response:
      - {name: exits, type: 'List<Integer>'}
      - {name: last_outputs, type: 'List<Boolean>'}
      - {name: canary_in_diagnostics, type: Boolean}
      - {name: killed_child_reaped, type: Boolean}
      - {name: killed_child_exit, type: Integer}
    outcomes: [{name: returned, returns: true}]

  - name: mantle.launch.VolatileReplayPreflight
    # Ordered entries: regular file, live link, dangling link, directory.
    response:
      - {name: refused, type: 'List<Boolean>'}
      - {name: dispatched, type: 'List<Boolean>'}
      - {name: ready, type: 'List<Boolean>'}
      - {name: preserved, type: 'List<Boolean>'}
      - {name: locks_left, type: 'List<Boolean>'}
      - {name: canary_in_diagnostics, type: Boolean}
    outcomes: [{name: returned, returns: true}]

  - name: mantle.launch.VolatileReplayBounds
    response:
      - {name: replayed_bytes, type: Integer}
      - {name: tail_matches, type: Boolean}
      - {name: exit, type: Integer}
      - {name: last_output_after, type: Boolean}
      - {name: stopped_within_budget, type: Boolean}
      - {name: canary_in_diagnostics, type: Boolean}
    outcomes: [{name: returned, returns: true}]

  - name: mantle.launch.PersistentReplayCompatibility
    response:
      - {name: exit, type: Integer}
      - {name: retained_bytes, type: Integer}
      - {name: tail_matches, type: Boolean}
      - {name: mode, type: Integer}
    outcomes: [{name: returned, returns: true}]
