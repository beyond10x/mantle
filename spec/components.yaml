components:
  - component: mantle-cli
    summary: Local session record operations; AWS, KubeVirt and Substrate are external adapters.
    owns:
      domains: [mantle.session, mantle.manifest, mantle.orchestration, mantle.operator]
    accepts:
      commands:
        - mantle.session.IdentityMigration
        - mantle.orchestration.CodexPreflight
        - mantle.session.AssessSharedBinaryUpgrade
        - mantle.session.AssessWorkerReadiness
        - mantle.session.AssessAgentInstallation
        - mantle.orchestration.Observe
        - mantle.orchestration.Request
        - mantle.orchestration.Start
        - mantle.orchestration.Stop
        - mantle.orchestration.Worker
        - mantle.orchestration.WorkerRecords
        - mantle.manifest.Parse
        - mantle.session.PutSource
        - mantle.session.ReadSources
        - mantle.manifest.ValidateMemory
        - mantle.manifest.ValidatePids
        - mantle.manifest.ValidateRetention
        - mantle.session.InsertSession
        - mantle.session.Materialized
        - mantle.session.MaterializationFailed
        - mantle.session.AgentStarted
        - mantle.session.AgentStartFailed
        - mantle.session.BeginStop
        - mantle.session.FinishStop
        - mantle.session.SetWorkspace
        - mantle.session.SetAgentExec
  - component: mantle-egress
    owns:
      domains: [mantle.egress]
    accepts:
      commands: [mantle.egress.CheckDefaultDestination, mantle.egress.Exchange, mantle.egress.ClassifyAddress, mantle.egress.CheckBudgets, mantle.egress.CheckDrain]
  - component: mantle-launch
    owns:
      domains: [mantle.launch]
    accepts:
      commands: [mantle.launch.ValidateScrollback, mantle.launch.ParseArgs, mantle.launch.ReadSecret, mantle.launch.ParseWindow, mantle.launch.ReplayRing, mantle.launch.Emit, mantle.launch.Lifecycle, mantle.launch.Signals, mantle.launch.SlowReader, mantle.launch.FileSafety, mantle.launch.VolatileReplayLifecycle, mantle.launch.VolatileReplayExitPaths, mantle.launch.VolatileReplayPreflight, mantle.launch.VolatileReplayBounds, mantle.launch.PersistentReplayCompatibility, mantle.launch.PrivatePaths, mantle.launch.AttachBackpressure]
