type: ess-scenario/4
domain: mantle.orchestration
scenario: codex-start
summary: Codex identity survives migration and starts and attaches through the existing transport.
timeline:
  - at: '2026-10-02T00:00:00Z'
    command: mantle.session.IdentityMigration
    input: {}
    outcome: returned
    response: {legacy_preserved: true, codex_preserved: true, indexes_preserved: true, unknown_refused: true, bad_pair_refused: true}
