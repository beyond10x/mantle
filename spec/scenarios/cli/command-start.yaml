type: ess-scenario/4
domain: mantle.orchestration
scenario: command-start
summary: A command session runs its declared argv through the launcher and terminal transport, with no agent credential, and each argv and auth rule is refused by name.
timeline:
  - at: '2026-10-29T00:00:00Z'
    command: mantle.orchestration.CommandPreflight
    input: {}
    outcome: returned
    response:
      started: true
      credential_reads: 0
      calls:
        - create
        - "isolated:/usr/bin/mkdir -p /workspace/.mantle/home /workspace/.mantle/cargo"
        - "network:/usr/bin/git -c http.proxy=http://127.0.0.1:3128 clone --no-tags --branch main -- https://github.com/beyond10x/substrate.git /workspace/substrate"
        - "isolated:/usr/bin/git -C /workspace/substrate rev-parse HEAD"
        - agent
        - attach
      state: RUNNING
      agent_exec: exec-1
      attach_argv: [/opt/mantle/bin/mantle-launch, attach, --wait-ready, --dir, /workspace/.mantle/agent]
      attach_has_secret: false
      request_has_secret: false
      request_credential_variables: []
      persisted_argv:
        - /opt/mantle/bin/mantle-launch
        - serve
        - --dir
        - /workspace/.mantle/agent
        - --cwd
        - /workspace/substrate
        - --mkdir
        - /workspace/.mantle/home
        - --mkdir
        - /workspace/.mantle/cargo
        - --proxy
        - http://127.0.0.1:3128
        - --
        - /bin/bash
        - -l
